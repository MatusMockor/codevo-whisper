  return `<div class="page">
    <div class="phead"><div><p class="kick">Stretnutia</p><h1>Nahrávanie a prepis stretnutí</h1><p class="sub">Mikrofón a zvuk systému ako dve stopy, prepis lokálne, hovoriaci farebne na časovej osi.</p></div></div>
    <div class="meet-grid">
      <div class="col">
        ${recordCard()}
        <section class="card" aria-labelledby="h-list"><div class="chead"><h2 id="h-list">Nahrané stretnutia</h2><span class="label-mono">${recorded.length}</span></div>
          ${recorded.length ? `<ol class="mlist" aria-label="Nahrané stretnutia">${recorded.map((m) => `<li><button type="button" class="mpick" data-act="msel" data-v="${m.id}" aria-current="${sel && m.id === sel.id}"><b>${m.title}</b><span>${led(PHASE[m.phase][0])}${m.dur} · ${PHASE[m.phase][1]}</span></button></li>`).join("")}</ol>` : `<p class="empty">Zatiaľ nemáte žiadne nahrané stretnutia. Po zastavení nahrávania sa tu zobrazí aj s prepisom.</p>`}
        </section>
        <section class="card" aria-labelledby="h-spk"><div class="chead"><h2 id="h-spk">Rozpoznávanie hovoriacich</h2>${led(S.diarizer === "ready" ? "ok" : "")}</div>
          <p style="margin:0 0 10px;font-size:12px;color:var(--ink-2)">Voliteľný model rozlíši v zvuku systému až štyroch hovoriacich ako Hovoriaci 1 až 4. Bez neho sa celá druhá strana označí ako Ostatní. Stiahne sa z Hugging Face iba po kliknutí na Stiahnuť a použije sa aj pri Prepísať znova.</p>
          <div class="models"><div class="mrow"><div class="nm"><b>Sortformer 4spk v2.1</b></div><div class="acts">${S.diarizer === "ready" ? `<button type="button" class="btn sm ghost" data-act="dia" data-v="none">Odstrániť</button>` : `<button type="button" class="btn sm" data-act="dia" data-v="ready">${ic("down", "sm")}Stiahnuť</button>`}</div><div class="mm"><span>139 MB</span><span>NVIDIA Open Model License</span><span>${S.diarizer === "ready" ? "Stiahnutý" : "Nestiahnutý"}</span></div></div></div>
        </section>
      </div>
      ${meetingDetail(sel)}

/* ---------- Nastavenia ---------- */
const SET_GROUPS = [
  ["g-dict", "Diktovanie"], ["g-mic", "Mikrofón"], ["g-insert", "Vkladanie textu"], ["g-edit", "Úprava prepisu"], ["g-ai", "AI úprava textu"], ["g-hist", "História prepisov"], ["g-sys", "Systém"], ["g-linux", "Prístup k systému"],
];
function row(id, title, desc, control, q = "") {
  return `<div class="srow" id="${id}" data-q="${esc((title + " " + desc + " " + q).toLowerCase())}"><div class="t"><b>${title}</b><span>${desc}</span></div>${control}</div>`;
}
function selectEl(key, opts, cur, label, disabled = false) {
  return `<select class="select" data-set="${key}" aria-label="${label}" ${disabled ? "disabled" : ""}>${opts.map(([v, l]) => `<option value="${v}" ${cur === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
}
function group(id, n, title, inner, tag = "") {
  return `<section class="group" id="${id}" aria-labelledby="${id}-h" data-title="${title.toLowerCase()}"><header><span class="n">${n}</span><h2 id="${id}-h">${title}</h2>${tag}</header><div class="rows">${inner}</div></section>`;
}
function aiFields() {
  if (S.aiProvider === "codex") return `<div class="ai-fields"><p class="warnnote">Text diktátu aj prepis stretnutia sa odošle do OpenAI pod vaším účtom v Codex CLI a čerpá limity vášho predplatného ChatGPT, približne 7 000 tokenov na jeden diktát.</p>
    <div class="field"><label for="cx-model">Model</label><input id="cx-model" class="input mono" data-input="codexModel" value="${esc(S.codexModel)}" placeholder="gpt-6-luna" spellcheck="false"><span class="hint">Odporúčané: gpt-6-luna s nízkou úrovňou uvažovania.</span></div>
    <div class="field"><span class="lab">Úroveň uvažovania</span>${seg("effort", [["none", "Žiadna"], ["low", "Nízka (odporúčané)"], ["medium", "Stredná"], ["high", "Vysoká"]], S.effort, "Úroveň uvažovania")}</div>
    <div class="inline field full"><button type="button" class="btn" data-act="ai-check">${S.aiCheck === "checking" ? "Overuje sa…" : "Overiť Codex CLI"}</button><span class="hint" aria-live="polite">${S.aiCheck === "done" ? `${led("ok")} Codex CLI funguje.` : ""}</span></div></div>`;
  const local = /127\.0\.0\.1|localhost/.test(S.aiUrl);
  return `<div class="ai-fields">
    <div class="field"><label for="ai-url">Adresa servera (OpenAI-compatible)</label><input id="ai-url" class="input mono" data-input="aiUrl" value="${esc(S.aiUrl)}" placeholder="http://127.0.0.1:11434/v1" spellcheck="false"><span class="hint ${local ? "" : "warn"}">${local ? "Adresa končí spravidla na /v1." : "Text sa odošle mimo tento počítač."}</span></div>
    <div class="field"><label for="ai-model">Model</label><input id="ai-model" class="input mono" list="ai-models" data-input="aiModel" value="${esc(S.aiModel)}" placeholder="qwen2.5:1.5b" spellcheck="false"><datalist id="ai-models"><option value="qwen2.5:7b"><option value="llama3.1:8b"><option value="gemma3:12b"></datalist></div>
    <div class="field"><label for="ai-key">API kľúč (nepovinné)</label><div class="inline"><input id="ai-key" type="password" class="input" ${S.aiKey === "stored" ? 'placeholder="••••••••" disabled' : ""} autocomplete="off"><button type="button" class="btn ${S.aiKey === "stored" ? "ghost" : ""}" data-act="ai-key">${S.aiKey === "stored" ? "Odstrániť kľúč" : "Uložiť kľúč"}</button></div><span class="hint">${S.aiKey === "stored" ? "Kľúč je uložený v systémovom úložisku." : "Lokálne servery ako Ollama kľúč nepotrebujú."}</span></div>
    <div class="field" style="justify-content:flex-end"><div class="inline"><button type="button" class="btn" data-act="ai-check">${S.aiCheck === "checking" ? "Overuje sa…" : "Overiť pripojenie"}</button><span class="hint" aria-live="polite">${S.aiCheck === "done" ? `${led("ok")} Spojenie funguje. Dostupné modely: 3.` : ""}</span></div></div>
  </div>`;
}

    + row("set-submit", "Automatické odoslanie", "Po vložení textu stlačí zvolenú skratku. Cmd+Enter na Macu, Ctrl+Enter na Linuxe.", selectEl("submit", [["off", "Vypnuté"], ["enter", "Enter"], ["primary-enter", "Cmd+Enter / Ctrl+Enter"]], S.submit, "Automatické odoslanie", S.insertion === "clipboard"), "enter")

    + row("set-filler", "Odstrániť výplňové slová", "Vynechá zaváhania ako ehm, eee, hmm, um a uh z hotového prepisu.", sw("filler", S.filler, "Odstrániť výplňové slová"))
    + row("set-trailing", "Pridať medzeru na konci", "Za neprázdny prepis pridá jednu medzeru pre plynulé pokračovanie v písaní.", sw("trailing", S.trailing, "Pridať medzeru na konci"));
  const ai = `<p class="lead">${S.aiProvider === "codex" ? "Po prepise môže diktát a poznámky zo stretnutí upraviť model OpenAI cez Codex CLI, v ktorom ste prihlásený." : "Po prepise môže diktát upraviť jazykový model na serveri, ktorý si nastavíte, napríklad Ollama alebo LM Studio. Bez adresy sa text nikam neposiela."}</p>`
    + row("set-ai", "Poskytovateľ", "Codex CLI používa váš účet ChatGPT. Vlastný server môže bežať aj na tomto počítači.", seg("aiProvider", [["server", "Vlastný server"], ["codex", "Codex CLI"]], S.aiProvider, "Poskytovateľ AI"), "ai ollama lm studio openai codex")

    + row("set-polish", "Upraviť diktát cez AI", S.aiProvider === "codex" ? "Odstráni zaváhania, opraví interpunkciu a zachová jazyk. Ak Codex CLI neodpovie do 8 sekúnd, vloží sa pôvodný prepis." : "Odstráni zaváhania, opraví interpunkciu a zachová jazyk. Ak server neodpovie do 8 sekúnd, vloží sa pôvodný prepis. Pre slovenčinu a češtinu použite model so 7B a viac parametrami, menšie modely menia význam.", sw("aiPolish", S.aiPolish, "Upraviť diktát cez AI", !aiReady()));

    + row("set-lx-kbd", "Prístup ku klávesnici", "X11 používa systémové skratky. Wayland vyžaduje prístup na čítanie ku klávesniciam aktívneho používateľa. Aplikácia nemení oprávnenia zariadení.", `<button type="button" class="btn sm" disabled>Skontrolovať znova</button>`, "linux x11 wayland")

function pagePrivacy() {
  return `<div class="page">
    <div class="phead"><div><p class="kick">Súkromie</p><h1>Kam putuje váš hlas</h1><p class="sub">V lokálnom režime sa reč prepisuje priamo na tomto Macu. Zvuk ani text sa nikam neposielajú. Internet sa používa iba na stiahnutie modelu z Hugging Face, keď kliknete na Stiahnuť, a na kontrolu aktualizácií aplikácie.</p></div></div>
    <div class="zones">
      <section class="zone local"><h3>${ic("laptop")}Ostáva na tomto Macu</h3><span class="when">vždy</span>
        <div class="minipath"><span>Mikrofón</span><i></i><span>Lokálny model</span><i></i><span>Vaša aplikácia</span></div>
        <ul><li>${ic("check", "sm")}Zvuk pri lokálnom prepise. Nahrávka existuje iba počas prepisu.</li><li>${ic("check", "sm")}Štatistiky, nastavenia a voliteľná história prepisov.</li><li>${ic("check", "sm")}Nahrávky a prepisy stretnutí.</li></ul></section>
      <section class="zone"><h3>${ic("server")}Ide na váš server</h3><span class="when">iba ak je server v trase prepisu</span>
        <div class="minipath"><span>Zvuk</span><i></i><span>${ic("lock", "sm")} E2E</span><i></i><span>${HOST}</span></div>
        <ul><li>${ic("lock", "sm")}Zvuk diktátu, zašifrovaný už na tomto počítači.</li><li>${ic("lock", "sm")}Prepis sa vracia šifrovane. Server zvuk ani text zámerne neukladá.</li><li>${ic("check", "sm")}História prepisov ostáva iba na tomto zariadení.</li></ul></section>
      <section class="zone"><h3>${ic("spark")}Ide k AI poskytovateľovi</h3><span class="when">iba ak zapnete AI úpravu</span>
        <div class="minipath"><span>Text</span><i></i><span>${S.aiProvider === "codex" ? "OpenAI cez Codex CLI" : "váš AI server"}</span></div>
        <ul><li>${ic("check", "sm")}Iba hotový text, nikdy zvuk.</li><li>${ic("check", "sm")}Pri vlastnom serveri na adrese 127.0.0.1 text neopustí počítač.</li><li>${ic("warn", "sm")}Codex CLI posiela text do OpenAI pod vaším účtom.</li></ul></section>
    </div>
    <div class="priv-cols">
      <section class="card"><div class="chead"><h2>${ic("mic", "sm")}Čo sa deje s vaším hlasom</h2></div>
        <ol class="steps"><li>Mikrofón sa zapne, až keď podržíte kláves. Keď ho pustíte, vypne sa.</li><li>Zvuk sa prepíše na text priamo na tomto Macu stiahnutým modelom.</li><li>Nahrávka existuje iba počas prepisu a hneď potom sa zahodí.</li><li>Text sa vloží do aplikácie. Posledné diktovanie ostane iba v pamäti, kým aplikáciu nezatvoríte.</li></ol>
        <p class="note" style="margin-top:12px">Ukazovateľ úrovne v Nastaveniach používa mikrofón iba vtedy, keď máte Nastavenia otvorené a okno aplikácie je aktívne.</p>
        <div class="chead" style="margin-top:18px"><h2>${ic("lock", "sm")}Čo Codevo Whisper nerobí</h2></div>
        <ul class="never"><li>${ic("x", "sm")}V lokálnom režime neposiela zvuk ani text na internet.</li><li>${ic("x", "sm")}Nezbiera analytiku ani telemetriu.</li><li>${ic("x", "sm")}Neuchováva zvuk v histórii prepisov.</li><li>${ic("x", "sm")}Nepotrebuje účet, e-mail ani predplatné.</li></ul>
      </section>
      <section class="card"><div class="chead"><h2>${ic("laptop", "sm")}Čo sa ukladá na tomto Macu</h2></div>
        <p style="margin:0 0 8px;font-size:12.5px;color:var(--ink-2)">Všetko je v priečinku aplikácie v <code class="mono" style="font-size:11.5px">~/Library/Application Support/Codevo Whisper</code>.</p>
        <p style="margin:0 0 8px;font-size:12.5px;color:var(--ink-2)">História je predvolene vypnutá. Po zapnutí ukladá iba text budúcich úspešne dokončených prepisov, nikdy zvuk. Limit je 10, 50, 100 alebo 500 prepisov, predvolene 100. Najstaršie sa automaticky vymažú; nižší limit ich vymaže ihneď.</p>
        <p style="margin:0;font-size:12.5px;color:var(--ink-2)">V Domov môžete vymazať jeden prepis alebo celú históriu. Vypnutie v Nastaveniach vymaže históriu a zastaví ďalšie ukladanie. Vymazanie nemení súhrnné štatistiky, posledné diktovanie v pamäti ani schránku. Nejde o bezpečné prepísanie disku.</p>
        <ul class="files"><li>Nastavenia<code>settings.json</code></li><li>Súhrnné štatistiky po dňoch, bez textu<code>stats.json</code></li><li>Voliteľná história prepisov a jej nastavenie, lokálny nešifrovaný text<code>history.json</code></li><li>Stiahnuté modely na prepis<code>priečinok models</code></li><li>Verzia aplikácie, pre ktorú je model pripravený na rýchly štart<code>warm-up.json</code></li></ul>
        <button type="button" class="linkbtn" style="margin-top:12px;font-size:12.5px" data-act="jump" data-v="settings" data-id="set-stats">Vynulovať štatistiky v Nastaveniach</button>
      </section>
    </div>
  </div>`;
}
</script>
<script>
"use strict";
/* ---------- Onboarding ---------- */
const OB_STEPS = [
  ["Mikrofón", "Prístup k mikrofónu", "Codevo Whisper počuje iba to, čo nadiktujete. Mikrofón sa zapne, až keď podržíte kláves, a po pustení sa vypne."],
  ["Povolenia", "Monitorovanie vstupu a prístupnosť", "Tieto dve povolenia nastavíte v Nastaveniach systému v časti Súkromie a bezpečnosť. Stav sa tu aktualizuje sám."],
  ["Skratka", "Klávesová skratka", "Zvoľte skratku na diktovanie, napríklad ⌃Space, ⌥⇧D alebo kombináciu modifikátorov."],
  ["Prepis", "Kde bude bežať prepis", "Prepisovať môžete priamo na tomto Macu, aj bez internetu, alebo na vlastnom serveri, kam zvuk putuje zašifrovaný od začiatku do konca. Rozhodnúť sa môžete aj neskôr."],
  ["Vyskúšať", "Vyskúšajte to", "Kliknite do poľa nižšie alebo do ľubovoľnej aplikácie a nadiktujte prvú vetu."],
];
function obBody() {
  const st = S.ob.step;
  if (st === 0) return `${permRow("mic", "Mikrofón", "Prístup k mikrofónu pre Codevo Whisper.")}<div class="card">${micControl()}</div>`;
  if (st === 1) return `${permRow("input", "Monitorovanie vstupu", "Aplikácia sleduje iba vybraný kláves, aby vedela, kedy diktujete.")}${permRow("acc", "Prístupnosť", "Umožní vložiť prepísaný text do aplikácie, v ktorej práve píšete.")}`;
  if (st === 2) return `<div class="card" style="display:flex;align-items:center;gap:16px;justify-content:space-between"><div><b>Skratka na diktovanie</b><p class="note" style="margin-top:3px">${MODE_DESC[S.mode]}</p></div>${hotkeyControl()}</div>`;
  if (st === 3) {
    const rec = S.server === "paired" && !modelReady() ? "server" : "local";
    const choices = [
      ["local", "laptop", "Na tomto zariadení", "Model sa raz stiahne z Hugging Face a potom prepisuje aj bez internetu. Zvuk neopustí počítač."],
      ["server", "server", "Na vlastnom serveri", "Prepisuje váš spárovaný server, napríklad domáci počítač s grafickou kartou. Zvuk putuje zašifrovaný od začiatku do konca."],
      ["later", "chev", "Nastavím neskôr", "Teraz sa nič nesťahuje ani nepáruje."],
    ];
    const c = S.ob.choice;
    let detail = "";
    if (c === "local") {
      const m = S.ms.pu8;
      detail = `<div class="card" style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>Parakeet Ultra</b> <span class="tag amber">Odporúčaný</span> <span class="tag">Najrýchlejší</span><p class="note" style="margin-top:4px">740 MB · CC-BY-4.0 · prepis funguje aj bez internetu</p></div>
        ${m.st === "ready" ? `<span class="pill ok">${led("ok")}Pripravený</span>` : m.st === "downloading" ? `<span class="pill amber">${Math.floor(m.p)} %</span>` : `<button type="button" class="btn primary" data-act="dl-model" data-v="pu8">${ic("down", "sm")}Stiahnuť</button>`}</div>
        ${m.st === "downloading" ? `<div class="prog"><i style="width:${m.p}%"></i></div><p class="note">Kým sa model sťahuje, môžete pokračovať. Diktovanie začne fungovať, keď bude pripravený.</p>` : ""}
        <button type="button" class="linkbtn" style="align-self:flex-start;font-size:12px" data-act="ob-models">Iný model: Canary 1B v2, Parakeet Ultra (malý), Whisper Large v3 Turbo</button></div>`;
    }
    if (c === "server") detail = S.server === "paired" ? `<div class="alert ok" role="status">${ic("check")}<p>Spárované so serverom ${HOST}. Prepisovať bude tento server.</p></div>` : pairTerm(false);
    if (c === "later") detail = `<p class="note">Kedykoľvek neskôr si model stiahnete alebo spárujete server v sekcii Prepis. Kým to neurobíte, Domov vám ukáže, čo chýba, ešte pred prvým diktovaním.</p>`;
    return `<div class="choice radios" role="radiogroup" aria-label="Kde bude bežať prepis">${choices.map(([id, icn, t, d]) => `<button type="button" role="radio" class="radio" aria-checked="${c === id}" data-act="ob-choose" data-v="${id}"><span class="head"><span class="ei">${ic(icn)}</span>${id === rec ? '<span class="tag amber">odporúčané</span>' : '<span class="dot"></span>'}</span><span><b>${t}</b><span>${d}</span></span></button>`).join("")}</div>${detail}`;
  }
  const t = tx();
  return `<div class="trybox" contenteditable="true" role="textbox" aria-label="Skúšobné pole" aria-multiline="true" tabindex="0"></div>
    ${!S.hotkey ? `<p class="note" style="color:var(--err-text)">${ic("warn", "sm")}Najprv nastavte klávesovú skratku v kroku 3.</p>` : t.state === "err" ? `<div class="alert" role="status">${ic("warn")}<p>${S.route[0] === "local" ? (downloading() ? "Model sa ešte sťahuje alebo nie je vybraný. Diktovanie začne fungovať, keď bude pripravený." : "Prepis zatiaľ nie je nastavený. Diktovanie začne fungovať, keď si stiahnete model alebo spárujete server.") : "Server zatiaľ nie je spárovaný. Diktovanie začne fungovať, keď ho spárujete v predchádzajúcom kroku alebo v sekcii Prepis."} <button type="button" class="linkbtn" data-act="ob-step" data-v="3">Späť na krok 4</button></p></div>` : `<p class="note">${ic("check", "sm")}${hkVerb()} <kbd>${S.hotkey}</kbd> a hovorte. Prepisuje sa na: ${esc(t.title)}.</p>`}`;
}
function renderOnboarding() {
  const st = S.ob.step;
  const steps = OB_STEPS.map(([short], i) => `${i ? `<span class="ob-wire ${i <= st ? "on" : ""}" aria-hidden="true"></span>` : ""}<button type="button" class="ob-step ${i < st ? "done" : ""}" data-act="ob-step" data-v="${i}" ${i === st ? 'aria-current="step"' : ""}><span class="no">${i < st ? "✓" : i + 1}</span>${short}</button>`).join("");
  return `<div class="ob" role="dialog" aria-modal="true" aria-labelledby="ob-title">
    <header class="ob-top"><span class="brand">${LOGO.replace('class="logo"', "")}Codevo Whisper</span><nav class="ob-steps" aria-label="Kroky nastavenia">${steps}</nav></header>
    <main class="ob-main"><div class="ob-inner"><span class="k">Krok ${st + 1} z 5</span><h1 id="ob-title">${OB_STEPS[st][1]}</h1><p class="lead">${OB_STEPS[st][2]}</p>${obBody()}</div></main>
    <footer class="ob-nav"><div>${st > 0 ? `<button type="button" class="btn" data-act="ob-step" data-v="${st - 1}">Späť</button>` : ""}</div>
      <div class="row-btns"><span class="label-mono">${st + 1}/5</span>${st < 4 ? `<button type="button" class="btn primary" data-act="ob-step" data-v="${st + 1}">Ďalej${ic("arrow", "sm")}</button>` : `<button type="button" class="btn primary" data-act="ob-done">Dokončiť</button>`}</div></footer>
  </div>`;
}

/* ---------- Overlay showcase ---------- */
function wave(n = 22) { return `<span class="wave" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i style="animation-delay:-${(i * 137) % 700}ms;height:${30 + ((i * 53) % 70)}%"></i>`).join("")}</span>`; }
function renderOverlay() {
  const fix = S.ovFix === "err"
    ? `<div class="ovcard err" role="alert"><div class="row"><span class="orb amber">${ic("warn", "sm")}</span><div><b>Lokálny model chýba</b><p>Toto diktovanie sa neprepísalo. Server ${HOST} je spárovaný a online, stačí naň prepnúť.</p></div></div>
        <div class="route"><span class="bad">Lokálne</span>${ic("arrow", "sm")}<span class="good">Server ${HOST} · 38 ms</span></div>
        <div class="acts"><button type="button" class="ovbtn primary" data-act="ov-fix" data-v="server">Prepisovať na serveri <kbd>↵</kbd></button><button type="button" class="ovbtn" data-act="ov-fix" data-v="dl">${ic("down", "sm")}Stiahnuť model · 740 MB</button><button type="button" class="ovbtn" data-act="ov-fix" data-v="reset">Zavrieť <kbd>esc</kbd></button></div></div>`
    : S.ovFix === "server"
      ? `<div class="ovcard" role="status"><div class="row"><span class="orb ok">${ic("check", "sm")}</span><div><b>Prepis beží na serveri ${HOST}</b><p>Stlačte <kbd>⌥Space</kbd> a nadiktujte to znova. Zmenu vrátite v sekcii Prepis.</p></div></div><div class="acts"><button type="button" class="ovbtn" data-act="ov-fix" data-v="reset">Ukázať chybu znova</button></div></div>`
      : `<div class="ovcard" role="status"><div class="row"><span class="orb amber">${ic("down", "sm")}</span><div><b>Sťahuje sa Parakeet Ultra · 34 %</b><p>Diktovanie začne fungovať, keď bude model pripravený. Dovtedy môžete prepisovať na serveri.</p></div></div><div class="acts"><button type="button" class="ovbtn primary" data-act="ov-fix" data-v="server">Zatiaľ prepisovať na serveri</button><button type="button" class="ovbtn" data-act="ov-fix" data-v="reset">Ukázať chybu znova</button></div></div>`;
  const cell = (cap, body, cls = "", tag = "") => `<div class="ovcell ${cls}"><div class="cap"><span>${cap}</span>${tag}</div><div class="spot">${body}</div></div>`;
  return `<div class="ovs" role="region" aria-label="Ukážka plávajúceho panela"><div class="ovs-wall"></div><div class="ovs-in">
    <div class="ovs-head"><div><h1>Plávajúci panel pri diktovaní</h1><p>Panel sa zobrazí nad aplikáciou, do ktorej píšete. Pri chybe ponúkne skutočnú opravu priamo na mieste, nie všeobecné „Otvoriť nastavenia".</p></div><span class="label-mono" style="color:#8A867E">vždy tmavý · nad každou aplikáciou</span></div>
    <div class="ovs-grid">
      ${cell("Chyba · lokálny model chýba, server je spárovaný", fix, "wide", "<b>opravené</b>")}
      ${cell("Chyba · lokálny model chýba, nič nie je spárované", `<div class="ovcard err" role="alert"><div class="row"><span class="orb">${ic("warn", "sm")}</span><div><b>Lokálny model chýba</b><p>Prepis potrebuje stiahnutý model alebo spárovaný server.</p></div></div><div class="acts"><button type="button" class="ovbtn primary">${ic("down", "sm")}Stiahnuť model · 740 MB</button><button type="button" class="ovbtn">Spárovať server</button></div></div>`)}
      ${cell("Chyba · server nie je dostupný", `<div class="ovcard err" role="alert"><div class="row"><span class="orb">${ic("server", "sm")}</span><div><b>Server nie je dostupný</b><p>${HOST} neodpovedá. Lokálny model Parakeet Ultra je pripravený.</p></div></div><div class="acts"><button type="button" class="ovbtn primary">Prepisovať lokálne</button><button type="button" class="ovbtn">Otestovať spojenie</button></div></div>`)}
      ${cell("Chyba · model potrebuje jazyk", `<div class="ovcard err" role="alert"><div class="row"><span class="orb">${ic("globe", "sm")}</span><div><b>Zvolený model potrebuje nastavený jazyk</b><p>Canary 1B v2 nevie rozpoznať jazyk automaticky.</p></div></div><div class="acts"><button type="button" class="ovbtn primary">Slovenčina</button><button type="button" class="ovbtn">Čeština</button><button type="button" class="ovbtn">Angličtina</button></div></div>`)}
      ${cell("Chyba · server treba znova spárovať", `<div class="ovcard err" role="alert"><div class="row"><span class="orb">${ic("lock", "sm")}</span><div><b>Server treba znova spárovať</b><p>Kým to neurobíte, Codevo Whisper naň neposiela zvuk.</p></div></div><div class="acts"><button type="button" class="ovbtn primary">Znova spárovať</button><button type="button" class="ovbtn">Prepisovať lokálne</button></div></div>`)}
      ${cell("Nahrávanie · Indikátor", `<p class="ovnotice">Mikrofón AirPods Pro Matúša nie je pripojený, používam predvolený</p><div class="ov rec" role="status" aria-label="Nahrávam"><span class="orb rec">${ic("mic", "sm")}</span>${wave()}<span class="time">0:07</span><span class="chip">sk</span><span class="lock" title="Prepis beží na šifrovanom serveri">${ic("lock", "sm")}E2E</span></div>`)}
      ${cell("Nahrávanie · Živý text", `<div class="ovlive" role="status"><p>Posielam opravenú verziu ponuky, zmenil som reakčný čas <span class="t">na štyri hodiny a</span></p><div class="ov"><span class="orb rec">${ic("mic", "sm")}</span>${wave(26)}<span class="time">0:12</span><span class="chip">sk</span><span class="lock">${ic("lock", "sm")}lokálne</span></div></div>`)}
      ${cell("Spracúvanie", `<div class="ov" role="status"><span class="orb proc">${ic("spin", "sm")}</span><span class="st">Spracúvam</span></div><div class="ov" role="status"><span class="orb proc">${ic("spin", "sm")}</span><span class="st">Spracúvam<small>dosiahnutý limit 10 minút</small></span></div>`)}
      ${cell("Hotovo", `<div class="ov" role="status"><span class="orb done">${ic("check", "sm")}</span><span class="st">Vložené<small>Slack</small></span></div><div class="ov" role="status"><span class="orb done">${ic("copy", "sm")}</span><span class="st">Skopírované - vlož cez ⌘V</span></div>`)}
      ${cell("Text nebol vložený", `<div class="ovcard" role="alert"><div class="row"><span class="orb amber">${ic("warn", "sm")}</span><div><b>Okno sa zmenilo, text nebol vložený</b><p>Prepis je pripravený, vložte ho ručne.</p></div></div><div class="acts"><button type="button" class="ovbtn primary">${ic("copy", "sm")}Kopírovať</button></div></div>`)}
      ${cell("Chyba počas prepisu · časť textu je hotová", `<div class="ovcard err" role="alert"><div class="row"><span class="orb">${ic("plug", "sm")}</span><div><b>Spojenie so serverom sa prerušilo</b><p>Doterajší prepis sa nestratil.</p></div></div><div class="acts"><button type="button" class="ovbtn primary">${ic("copy", "sm")}Kopírovať doterajší text</button></div></div>`)}
    </div></div></div>`;
}

/* ---------- palette ---------- */
const PAL_ITEMS = [
  ...PAGES.map((p) => ({ t: p.label, g: "Sekcia", icon: p.icon, run: () => go(p.id) })),
  { t: "Kde beží prepis · trasa a záloha", g: "Prepis", icon: "route", run: () => go("tx") },
  { t: "Spárovať server", g: "Prepis", icon: "server", run: () => go("tx", "sec-server") },
  { t: "Lokálny model · stiahnuť alebo zmeniť", g: "Prepis", icon: "down", run: () => go("tx", "sec-model") },
  { t: "Akcelerácia (GPU / CPU)", g: "Prepis", icon: "laptop", run: () => go("tx", "set-accel") },
  { t: "Uvoľniť model z pamäte", g: "Prepis", icon: "laptop", run: () => go("tx", "set-unload") },
  ...[["set-hotkey", "Klávesová skratka"], ["set-mode", "Režim klávesu"], ["set-overlay", "Zobrazenie panela"], ["set-lang", "Jazyk"], ["set-mute", "Stlmiť počas nahrávania"], ["set-feedback", "Zvuková odozva"], ["set-output", "Výstupné zariadenie"], ["set-volume", "Hlasitosť odozvy"]].map(([id, t]) => ({ t, g: "Diktovanie", icon: "key", run: () => go("settings", id) })),
  { t: "Mikrofón a úroveň vstupu", g: "Mikrofón", icon: "mic", run: () => go("settings", "set-mic") },
  ...[["set-insert", "Spôsob vkladania textu"], ["set-clip", "Schránka"], ["set-submit", "Automatické odoslanie (Enter)"], ["set-linuxpaste", "Skratka na vloženie (Linux)"]].map(([id, t]) => ({ t, g: "Vkladanie textu", icon: "insert", run: () => go("settings", id) })),
  ...[["set-words", "Vlastné slová"], ["set-filler", "Odstrániť výplňové slová"], ["set-trailing", "Pridať medzeru na konci"]].map(([id, t]) => ({ t, g: "Úprava prepisu", icon: "wave", run: () => go("settings", id) })),
  ...[["set-ai", "Poskytovateľ AI (Ollama, Codex CLI)"], ["set-polish", "Upraviť diktát cez AI"]].map(([id, t]) => ({ t, g: "AI úprava", icon: "spark", run: () => go("settings", id) })),
  ...[["set-hist", "Ukladať históriu prepisov"], ["set-histlimit", "Počet uchovaných prepisov"]].map(([id, t]) => ({ t, g: "História", icon: "file", run: () => go("settings", id) })),
  ...[["set-launch", "Spustiť po prihlásení"], ["set-stats", "Vynulovať štatistiky"], ["set-update", "Skontrolovať aktualizácie"]].map(([id, t]) => ({ t, g: "Systém", icon: "sliders", run: () => go("settings", id) })),
  { t: "Začať nahrávanie stretnutia", g: "Akcia", icon: "rec", run: () => go("meetings") },
  { t: "Prepnúť tému", g: "Akcia", icon: "moon", run: () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark") },
  { t: "Spustiť sprievodcu nastavením", g: "Akcia", icon: "chev", run: () => { S.screen = "onboarding"; render(); } },

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset.input;
  if (!k) return;
  if (k === "setq") { S.setq = e.target.value; filterSettings(); return; }
  if (k === "pq") { S.pq = e.target.value; S.psel = 0; renderLayer(); return; }
  if (k === "volume") { S.volume = +e.target.value; $("#vol-out").textContent = `${S.volume} %`; return; }
  S[k] = e.target.value;
  if (k === "pairToken") { const b = $('[data-act="pair"]'); if (b) b.disabled = !S.pairToken.trim(); }
  if (k === "aiUrl" || k === "aiModel") { S.aiCheck = "idle"; }
});
document.addEventListener("change", (e) => {
  const k = e.target.dataset.set;
  if (!k) return;
  S[k] = e.target.value;
  render();
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); S.palette ? (S.palette = false, renderLayer()) : ACT.palette(); return; }
  if (S.hkRec && S.screen !== "overlay") {
    if (e.key === "Escape") { S.hkRec = false; render(); return; }
    const mods = (e.ctrlKey ? "⌃" : "") + (e.altKey ? "⌥" : "") + (e.shiftKey ? "⇧" : "") + (e.metaKey ? "⌘" : "");
    if (["Control", "Alt", "Shift", "Meta"].includes(e.key)) return;
    e.preventDefault();
    const key = e.code === "Space" ? "Space" : e.code.startsWith("Key") ? e.code.slice(3) : e.key.length === 1 ? e.key.toUpperCase() : e.key;
    if (!mods) return;
    S.hotkey = mods + key; S.hkRec = false; render(); return;
  }
  if (S.palette) {
    const n = palMatches().length;
    if (e.key === "Escape") { S.palette = false; renderLayer(); $(".cmdk").focus(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); S.psel = (S.psel + 1) % Math.max(1, n); renderLayer(); $(`#pal-${S.psel}`) && $(`#pal-${S.psel}`).scrollIntoView({ block: "nearest" }); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); S.psel = (S.psel - 1 + n) % Math.max(1, n); renderLayer(); $(`#pal-${S.psel}`) && $(`#pal-${S.psel}`).scrollIntoView({ block: "nearest" }); return; }
    if (e.key === "Enter") { e.preventDefault(); const it = palMatches()[S.psel]; if (it) { S.palette = false; it.run(); } return; }
    return;
  }
  if (e.key === "Escape" && S.drawer) { const id = S.drawer; S.drawer = null; renderLayer(); const n = $(`.node[data-v="${id}"]`); if (n) n.focus(); return; }
  if (e.key === "Escape" && (S.histConfirm || S.histClearConfirm || S.mAction === "confirm" || S.disconnectConfirm || S.statsReset === "confirm")) { S.histConfirm = S.histClearConfirm = S.disconnectConfirm = false; if (S.mAction === "confirm") S.mAction = null; if (S.statsReset === "confirm") S.statsReset = "idle"; render(); return; }
  const col = e.target.closest && e.target.closest(".wc-col");
  if (col && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    e.preventDefault();
    const sib = e.key === "ArrowLeft" ? col.previousElementSibling : col.nextElementSibling;
    if (sib) { col.tabIndex = -1; sib.tabIndex = 0; sib.focus(); }
    return;
  }
  const tab = e.target.closest && e.target.closest('.nav [role="tab"]');
  if (tab && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const i = PAGES.findIndex((p) => p.id === S.page);
    const next = PAGES[(i + (e.key === "ArrowDown" ? 1 : -1) + PAGES.length) % PAGES.length];
    go(next.id); $(`.nav [data-v="${next.id}"]`).focus();
  }
});

document.addEventListener("dragover", (e) => { const s = e.target.closest && e.target.closest(".slot"); if (!s) return; e.preventDefault(); $$(".slot.over").forEach((x) => x !== s && x.classList.remove("over")); s.classList.add("over"); });
document.addEventListener("drop", (e) => {
  const s = e.target.closest && e.target.closest(".slot");
  if (!s) return;
  e.preventDefault();
  const eng = e.dataTransfer.getData("text/plain");
  const slot = +s.dataset.slot;
  const other = eng === "server" ? "local" : "server";
  const from = S.route.indexOf(eng);
  if (from === slot) { render(); return; }
  if (slot === 0) S.route = S.route.includes(other) ? [eng, other] : [eng];
  if (slot === 1) { if (other === "server" && !paired()) { render(); return; } S.route = [other, eng]; }
  render();
  toast(`Trasa: ${ROUTE_TEXT[S.route.join(",")][0]}.`);
});

  }
}, 1500);
setInterval(() => { if (S.recording && $("#rec-clock")) $("#rec-clock").textContent = clock(Date.now() - S.recording); }, 500);

applyScenario("nomodel");
(function fromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("theme")) document.documentElement.dataset.theme = h.get("theme");
  if (h.get("scenario")) applyScenario(h.get("scenario"));
  if (h.get("server")) S.server = h.get("server");
  if (h.get("screen")) S.screen = h.get("screen");
  if (h.get("page")) S.page = h.get("page");
  if (h.get("drawer")) S.drawer = h.get("drawer");
  if (h.get("palette")) { S.palette = true; S.pq = h.get("palette") === "1" ? "" : h.get("palette"); }
  if (h.get("ob")) { S.ob.step = +h.get("ob"); S.ob.choice = h.get("choice"); }
  if (h.get("banner")) S.pairBanner = h.get("banner");
  if (["1", "2", "3"].includes(h.get("stats"))) S.statsV = h.get("stats");
  if (h.get("range") === "30") S.chartRange = "30";
  if (STATS[h.get("period")]) S.period = h.get("period");
  if (h.get("more")) S.statsMore = true;
  if (h.get("scroll")) setTimeout(() => { const el = document.getElementById(h.get("scroll")); if (el) { $("#main").style.scrollBehavior = "auto"; el.scrollIntoView({ block: "start" }); } }, 50);
})();
render();
</script>
