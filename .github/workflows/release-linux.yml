name: Release Linux

on:
  workflow_call:
    inputs:
      version:
        description: Version without the v prefix, resolved and verified by the calling release workflow
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing, without the v prefix, for example 1.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCH: ${{ matrix.arch }}
      DIST_DIR: apps/desktop/release/linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the build commit
        if: github.event_name == 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        run: scripts/release/verify-build-ref.sh
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: scripts/release/resolve-version.sh
      - name: Check the version matches the requested one
        env:
          RESOLVED: ${{ steps.resolve.outputs.version }}
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ "$RESOLVED" != "$REQUESTED" ]; then
            echo "resolved version $RESOLVED != requested version $REQUESTED" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev libjson-glib-dev libatspi2.0-dev libevdev-dev libudev-dev libxi-dev libxtst-dev libxfixes-dev libx11-dev libvulkan-dev glslc spirv-headers
      - name: Build Linux native resources
        run: scripts/release/build-native.sh "$ARCH"
      - name: Build the desktop bundle
        run: pnpm --filter @codevo-whisper/desktop build
      - name: Package AppImage and deb
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux AppImage deb "--$ARCH" --publish never -c.extraMetadata.version="$VERSION" -c.directories.output="release/linux/$ARCH"
      - name: Write checksums
        working-directory: ${{ env.DIST_DIR }}
        run: sha256sum -- *.AppImage *.deb > "SHA256SUMS-linux-$ARCH"
      - name: Verify the update manifest and checksums
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          manifest=latest-linux.yml
          if [ "$ARCH" != "x64" ]; then
            manifest="latest-linux-$ARCH.yml"
          fi
          node scripts/release/verify-feed.ts "$DIST_DIR/$manifest" "$VERSION"
          node scripts/release/verify-checksums.ts "$DIST_DIR/SHA256SUMS-linux-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            ${{ env.DIST_DIR }}/*.AppImage
            ${{ env.DIST_DIR }}/*.deb
            ${{ env.DIST_DIR }}/latest-linux*.yml
            ${{ env.DIST_DIR }}/SHA256SUMS-linux-*
          overwrite: true
          if-no-files-found: error
          retention-days: 14
