name: Release Linux

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: Build the Linux packages (Linux support lands in phase 4, keep off until then)
        required: false
        default: false
        type: boolean
      version:
        description: Version without the v prefix, for example 1.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    if: inputs.enabled
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCH: ${{ matrix.arch }}
      DIST_DIR: apps/desktop/release/linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: scripts/release/resolve-version.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the desktop bundle
        run: pnpm --filter @codevo-whisper/desktop build
      - name: Package AppImage and deb
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux AppImage deb "--$ARCH" --publish never -c.extraMetadata.version="$VERSION" -c.directories.output="release/linux/$ARCH"
      - name: Write checksums
        working-directory: ${{ env.DIST_DIR }}
        run: sha256sum ./*.AppImage ./*.deb > "SHA256SUMS-linux-$ARCH"
      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          path: |
            ${{ env.DIST_DIR }}/*.AppImage
            ${{ env.DIST_DIR }}/*.deb
            ${{ env.DIST_DIR }}/latest-linux*.yml
            ${{ env.DIST_DIR }}/SHA256SUMS-linux-*
          if-no-files-found: error
          retention-days: 14
