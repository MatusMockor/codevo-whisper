name: codevo-whisper

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  gateway:
    <<: *hardening
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    image: codevo-whisper-gateway:local
    env_file: .env
    environment:
      CW_BIND: 0.0.0.0
      CW_PORT: "8787"
      CW_STT_URL: http://stt:8001
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${CW_BIND:-127.0.0.1}:${CW_PORT:-8787}:8787"
    volumes:
      - cw-data:/data
      - cw-run:/run/codevo-whisper
    mem_limit: ${GATEWAY_MEM_LIMIT:-512m}
    cpus: ${GATEWAY_CPUS:-2}
    pids_limit: 64
    ulimits:
      core: 0
      nofile:
        soft: 4096
        hard: 4096
    depends_on:
      - stt

  stt:
    <<: *hardening
    build:
      context: ../..
      dockerfile: apps/stt/Dockerfile
    image: codevo-whisper-stt:local
    environment:
      STT_ENGINE: ${STT_ENGINE:-worker}
      STT_BACKEND: ${STT_BACKEND:-vulkan}
      STT_THREADS: ${STT_THREADS:-4}
      TMPDIR: /tmp
    tmpfs:
      - /tmp:size=64m,mode=1777
    devices:
      - "${STT_RENDER_DEVICE:-/dev/dri/renderD128}:/dev/dri/renderD128"
    group_add:
      - "${RENDER_GID:?set RENDER_GID in .env}"
    volumes:
      - cw-models:/models:ro
    mem_limit: ${STT_MEM_LIMIT:-4g}
    cpus: ${STT_CPUS:-4}
    pids_limit: 128
    ulimits:
      core: 0
      nofile:
        soft: 1024
        hard: 1024

  stt-provision:
    <<: *hardening
    image: codevo-whisper-stt:local
    profiles:
      - provision
    command: ["node", "dist/provision.js"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - cw-models:/models
    mem_limit: 1g
    cpus: 2
    pids_limit: 64
    ulimits:
      core: 0
      nofile:
        soft: 1024
        hard: 1024
    restart: "no"

volumes:
  cw-data:
  cw-run:
  cw-models:
